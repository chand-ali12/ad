<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fveicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Authentic Detective</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.AIStylistConfig = {
        // Uses the same working key as the old production site.
        apiKey:
          "1c60aed5401b51d285f34e033ae238d0ab9555b0684a41b55e013e39c834462be66c471938bc4f149397a3f9ef5aaef619c7b019f9ca8c07021527017174b0944343ff4f8d1ae6da7092030827999d68",
        apiUrl: "https://kaido.sandboxdevenv.com",
        title: "Authentic Detective",
        subtitle: "Your personal assistant",
        primary: "#3C1F1B",
        botIconColor: "#5a2f28",
        position: "bottom-right",
        borderRadius: "rounded",
        chatWindowSize: "medium",
        promptSource: "custom",
      };
    </script>
    <script
      src="https://kaido.sandboxdevenv.com/plugin/ai-stylist-chat-widget.js"
      async
    ></script>
    <script>
      (function () {
        const WELCOME_CLASS = "aisw-welcome-message";
        const PROMPTS_CLASS = "aisw-quick-prompts";

        const defaultPrompts = [
          {
            label: "Order status",
            msg: "I'd like to check my order status",
            icon: "📦",
          },
          {
            label: "Pricing",
            msg: "How much does authentication cost?",
            icon: "💰",
          },
          {
            label: "Turnaround time",
            msg: "What is the turnaround time?",
            icon: "⏱️",
          },
          {
            label: "Services",
            msg: "What authentication services do you offer?",
            icon: "🛎️",
          },
          {
            label: "Authentication process",
            msg: "How does your authentication process work?",
            icon: "🔍",
          },
        ];

        function createDefaultUi(messagesEl) {
          if (!messagesEl || messagesEl.querySelector(`.${WELCOME_CLASS}`))
            return;

          const title = window.AIStylistConfig?.title || "Authentic Detective";
          const subtitle =
            window.AIStylistConfig?.subtitle || "Your personal assistant";

          const welcome = document.createElement("div");
          welcome.className = WELCOME_CLASS;
          welcome.innerHTML = `
            <div class="aisw-welcome-content">
              <div class="aisw-welcome-emoji">🕵️‍♂️</div>
              <h3 class="aisw-welcome-title">Welcome to ${title}!</h3>
              <p class="aisw-welcome-text">${subtitle} We're here to assist you.</p>
            </div>
          `;

          const quickPrompts = document.createElement("div");
          quickPrompts.className = PROMPTS_CLASS;
          quickPrompts.innerHTML = defaultPrompts
            .map(
              (p) => `
                <button
                  type="button"
                  class="aisw-quick-prompt-btn"
                  aria-label="${p.label}"
                  data-message="${p.msg.replace(/"/g, "&quot;")}"
                >
                  <span class="aisw-quick-prompt-icon">${p.icon}</span>
                  <span class="aisw-quick-prompt-label">${p.label}</span>
                </button>
              `,
            )
            .join("");

          messagesEl.appendChild(welcome);
          messagesEl.appendChild(quickPrompts);
        }

        function attachQuickPromptClick() {
          document.addEventListener("click", function (event) {
            const promptBtn = event.target.closest(".aisw-quick-prompt-btn");
            if (!promptBtn) return;

            const chatWindow = promptBtn.closest(".aisw-chat-window");
            if (!chatWindow) return;

            const textarea = chatWindow.querySelector(".aisw-textarea");
            const sendBtn = chatWindow.querySelector(".aisw-send-btn");
            const msg = promptBtn.getAttribute("data-message") || "";
            if (!textarea || !sendBtn || !msg) return;

            textarea.value = msg;
            textarea.dispatchEvent(new Event("input", { bubbles: true }));
            sendBtn.click();
          });
        }

        function ensureDefaultUi() {
          const messagesEl = document.querySelector(".aisw-messages");
          if (messagesEl) createDefaultUi(messagesEl);
        }

        const observer = new MutationObserver(ensureDefaultUi);
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });

        attachQuickPromptClick();
        ensureDefaultUi();
      })();
    </script>
  </body>
</html>
